<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're invited — Julia Shchgolkova</title>
    <meta name="description" content="You're invited to Julia Shchgolkova's birthday party." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #3a2a24;
        --muted: #7a655c;
        --paper: #f6efe6;
        --card: #fffaf4;
        --line: #d8c4b0;
        --accent: #b4533a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        color: var(--ink);
        background:
          radial-gradient(circle at top, #fff8ef, var(--paper) 55%);
        font-family: Outfit, system-ui, sans-serif;
        font-weight: 300;
      }

      main {
        width: min(36rem, 100%);
        padding: 3.5rem 2rem 3rem;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: 0 18px 50px rgba(80, 50, 30, 0.08);
      }

      p {
        margin: 0;
      }

      .eyebrow {
        letter-spacing: 0.28em;
        text-transform: uppercase;
        font-size: 0.78rem;
        color: var(--accent);
      }

      h1 {
        margin: 1.1rem 0 0.4rem;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(2.4rem, 8vw, 3.6rem);
        font-weight: 400;
        line-height: 1.05;
      }

      .lead {
        color: var(--muted);
        font-size: 1.05rem;
      }

      hr {
        width: 4rem;
        margin: 2rem auto;
        border: 0;
        border-top: 1px solid var(--line);
      }

      .note {
        max-width: 22rem;
        margin: 0 auto;
        line-height: 1.6;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">You're invited</p>
      <h1>Julia Shchgolkova</h1>
      <p class="lead">Birthday party</p>
      <hr />
      <p class="note">A small celebration is being planned. Details will follow here.</p>
    </main>
  </body>
</html>
